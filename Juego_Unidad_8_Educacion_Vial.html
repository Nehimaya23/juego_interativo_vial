<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unidad 8 | Simulador de Trámite</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f5f9;font-family:system-ui,Arial;color:#142a40}.top{background:linear-gradient(120deg,#082c53,#126aa3);color:white;padding:28px 20px;text-align:center;border-bottom:7px solid #e9bd38}.top small{letter-spacing:2px}h1{margin:10px 0}main{max-width:850px;margin:24px auto;padding:24px;background:white;border-radius:18px;box-shadow:0 8px 30px #183e5b18}.muted{color:#587086}.progress{height:10px;background:#e2e8f0;border-radius:12px;overflow:hidden;margin:18px 0}.bar{height:100%;background:#e7b83e;transition:width .3s}.question{font-size:1.3rem;font-weight:750;margin:20px 0}.choices{display:grid;gap:12px}button{cursor:pointer;border:2px solid #d1e2ee;border-radius:12px;background:#f8fbff;padding:15px;font-size:1rem;color:#163953;text-align:left}button:hover:not(:disabled){border-color:#1376ae;background:#eaf6ff}button:disabled{cursor:default;opacity:.8}.primary{background:#075b92;color:white;border-color:#075b92;text-align:center}.good{background:#dcfce7!important;border-color:#16a34a!important}.bad{background:#fee2e2!important;border-color:#dc2626!important}.feedback{margin:16px 0;font-weight:700;min-height:24px}.stats{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.cards button{min-height:100px;text-align:center;overflow-wrap:anywhere}.cards button.hidden{background:#0b6597;color:white;font-size:2rem}.cards button.matched{background:#dcfce7;border-color:#16a34a}.footer{text-align:center;color:#6b7b8b;font-size:.85rem;padding:16px}@media(max-width:560px){main{margin:10px;padding:16px}.cards{grid-template-columns:repeat(4,1fr)}.cards button{font-size:.75rem;padding:5px;min-height:88px}}</style></head><body><header class="top"><small>INFOP VIRTUAL · EDUCACIÓN VIAL · UNIDAD 8</small><h1>Simulador de Trámite</h1><p>Ordena el trámite y responde las edades mínimas.</p></header><main><div id="stat" class="muted"></div><div class="progress"><div id="bar" class="bar"></div></div><section id="area"></section></main><div class="footer">Actividad interactiva educativa · INFOP Virtual</div><script>const DATA={"title": "Simulador de Trámite", "type": "order", "intro": "Ordena el trámite y responde las edades mínimas.", "steps": ["Reunir identidad vigente y certificados médicos y psicológicos", "Presentarse al Centro de Evaluación de Conductores", "Aprobar la evaluación teórica de conocimientos", "Aprobar la evaluación práctica de conducción", "Cancelar el arancel y recibir el permiso de conducir"], "questions": [["Tipo A y B", ["18 años", "21 años", "23 años"], 0], ["Tipo C1 y D1", ["18 años", "21 años", "23 años"], 1], ["Tipo C y D", ["18 años", "21 años", "23 años"], 1], ["Tipo CE", ["18 años", "21 años", "23 años"], 2]]};const d=DATA;let i=0,score=0,locked=false,timer=null,stage=0,attempts=0;const area=document.getElementById('area'),stat=document.getElementById('stat'),bar=document.getElementById('bar');function update(n,total){stat.textContent=`Progreso: ${n} / ${total} · Aciertos: ${score}`;bar.style.width=(total?100*n/total:0)+'%'}function finish(){clearInterval(timer);update(total(),total());area.innerHTML=`<h2>🎉 ¡Actividad completada!</h2><p>Respuestas correctas: <strong>${score}</strong> de ${total()}.</p><button class="primary" onclick="location.reload()">Volver a jugar</button>`}function total(){return d.type==='classify'?d.items.length:d.type==='memory'?d.pairs.length:d.type==='order'?d.steps.length+d.questions.length:d.questions.length}function feedback(ok,correct){let f=document.getElementById('feedback');f.textContent=ok?'✓ ¡Correcto!':`✗ Respuesta correcta: ${correct}`;f.style.color=ok?'#15803d':'#b91c1c'}function next(){i++;locked=false;render()}function quiz(){let q=d.questions[i];if(!q)return finish();update(i,total());area.innerHTML=`<p class="muted">Pregunta ${i+1} de ${d.questions.length}</p><div class="question">${q[0]}</div><div class="choices">${q[1].map((x,j)=>`<button onclick="answer(${j})">${x}</button>`).join('')}</div><div id="feedback" class="feedback"></div><button id="next" class="primary" style="display:none" onclick="next()">${i===d.questions.length-1?'Finalizar':'Siguiente pregunta'}</button>`}function answer(j){if(locked)return;locked=true;let q=d.questions[i],ok=j===q[2];if(ok)score++;let bs=area.querySelectorAll('.choices button');bs.forEach((b,k)=>{b.disabled=true;if(k===q[2])b.classList.add('good');else if(k===j)b.classList.add('bad')});feedback(ok,q[1][q[2]]);document.getElementById('next').style.display='block'}function classify(){let q=d.items[i];if(!q)return finish();update(i,total());area.innerHTML=`<p class="muted">Elemento ${i+1} de ${d.items.length}</p><div class="question">${q[0]}</div><div class="choices">${d.categories.map((x,j)=>`<button onclick="classAnswer(${j})">${x}</button>`).join('')}</div><div id="feedback" class="feedback"></div><button id="next" class="primary" style="display:none" onclick="next()">Continuar</button>`}function classAnswer(j){if(locked)return;locked=true;let q=d.items[i],ok=j===q[1];if(ok)score++;area.querySelectorAll('.choices button').forEach((b,k)=>{b.disabled=true;if(k===q[1])b.classList.add('good');else if(k===j)b.classList.add('bad')});feedback(ok,d.categories[q[1]]);document.getElementById('next').style.display='block'}function tf(){let q=d.questions[i];if(!q)return finish();update(i,total());let time=10;area.innerHTML=`<div class="stats"><span>Afirmación ${i+1} de ${d.questions.length}</span><strong id="clock">⏱ ${time} s</strong></div><div class="question">${q[0]}</div><div class="choices"><button onclick="tfAnswer(true)">VERDADERO</button><button onclick="tfAnswer(false)">FALSO</button></div><div id="feedback" class="feedback"></div><button id="next" class="primary" style="display:none" onclick="next()">Continuar</button>`;timer=setInterval(()=>{time--;document.getElementById('clock').textContent=`⏱ ${time} s`;if(time<=0)tfAnswer(null)},1000)}function tfAnswer(v){if(locked)return;locked=true;clearInterval(timer);let q=d.questions[i],ok=v===q[1];if(ok)score++;area.querySelectorAll('.choices button').forEach((b,k)=>{b.disabled=true;if((k===0)===q[1])b.classList.add('good');else if(v!==null&&(k===0)===v)b.classList.add('bad')});feedback(ok,q[1]?'Verdadero':'Falso');document.getElementById('next').style.display='block'}let deck=[],flipped=[],matched=0;function memoryInit(){deck=d.pairs.flatMap((p,j)=>[{id:j,text:p[0]},{id:j,text:p[1]}]);for(let j=deck.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[deck[j],deck[k]]=[deck[k],deck[j]]}memoryRender()}function memoryRender(){update(matched,d.pairs.length);area.innerHTML=`<p class="muted">Intentos: ${attempts}. Encuentra las parejas.</p><div class="cards">${deck.map((c,j)=>`<button id="card${j}" class="hidden" onclick="flip(${j})">?</button>`).join('')}</div>`}function flip(j){if(locked||flipped.includes(j)||deck[j].done)return;let b=document.getElementById('card'+j);b.classList.remove('hidden');b.textContent=deck[j].text;flipped.push(j);if(flipped.length===2){locked=true;attempts++;let [a,c]=flipped;if(deck[a].id===deck[c].id){deck[a].done=deck[c].done=true;document.getElementById('card'+a).classList.add('matched');document.getElementById('card'+c).classList.add('matched');matched++;score++;flipped=[];locked=false;update(matched,d.pairs.length);if(matched===d.pairs.length)setTimeout(finish,700)}else setTimeout(()=>{[a,c].forEach(x=>{let el=document.getElementById('card'+x);el.textContent='?';el.classList.add('hidden')});flipped=[];locked=false},1000)}}let ordered=[];function order(){if(stage===0){update(ordered.length,total());let options=d.steps.map((x,j)=>({x,j})).filter(x=>!ordered.includes(x.j));area.innerHTML=`<h2>Fase 1: Ordena el trámite</h2><p>Selecciona el paso que corresponde a la posición ${ordered.length+1}.</p><div class="choices">${options.map(o=>`<button onclick="chooseStep(${o.j})">${o.x}</button>`).join('')}</div><div id="feedback" class="feedback"></div>`}else{let q=d.questions[i];if(!q)return finish();update(d.steps.length+i,total());area.innerHTML=`<h2>Fase 2: Categorías de licencia</h2><div class="question">¿Qué edad mínima corresponde a ${q[0]}?</div><div class="choices">${q[1].map((x,j)=>`<button onclick="orderAnswer(${j})">${x}</button>`).join('')}</div><div id="feedback" class="feedback"></div><button id="next" class="primary" style="display:none" onclick="nextOrder()">Continuar</button>`}}function chooseStep(j){if(j===ordered.length){ordered.push(j);score++;if(ordered.length===d.steps.length){stage=1;i=0}order()}else feedback(false,d.steps[ordered.length])}function orderAnswer(j){if(locked)return;locked=true;let q=d.questions[i],ok=j===q[2];if(ok)score++;area.querySelectorAll('.choices button').forEach((b,k)=>{b.disabled=true;if(k===q[2])b.classList.add('good');else if(k===j)b.classList.add('bad')});feedback(ok,q[1][q[2]]);document.getElementById('next').style.display='block'}function nextOrder(){i++;locked=false;order()}function render(){if(d.type==='quiz')quiz();else if(d.type==='tf')tf();else if(d.type==='classify')classify();else if(d.type==='order')order()}if(d.type==='memory')memoryInit();else render();</script></body></html>
